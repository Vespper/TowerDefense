<text x="60" y="774" font-size="17"><tspan fill="#c9a23a" font-weight="bold">Ferveur</tspan><tspan fill="#8a8070"> › </tspan><tspan fill="#9b5cc0" font-weight="bold">Démence</tspan><tspan fill="#c8bea8"> : la foi exorcise la folie</tspan></text>
<text x="60" y="805" font-size="17"><tspan fill="#9b5cc0" font-weight="bold">Démence</tspan><tspan fill="#8a8070"> › </tspan><tspan fill="#3f78a8" font-weight="bold">Abîme</tspan><tspan fill="#c8bea8"> : le fou regarde l'abîme sans ciller</tspan></text>
<text x="60" y="836" font-size="17"><tspan fill="#3f78a8" font-weight="bold">Abîme</tspan><tspan fill="#8a8070"> › </tspan><tspan fill="#d4582b" font-weight="bold">Cendre</tspan><tspan fill="#c8bea8"> : les eaux noires étouffent la braise</tspan></text>
<text x="60" y="867" font-size="17"><tspan fill="#d4582b" font-weight="bold">Cendre</tspan><tspan fill="#8a8070"> › </tspan><tspan fill="#d9cfb0" font-weight="bold">Os</tspan><tspan fill="#c8bea8"> : le bûcher réduit les os en poussière</tspan></text>
<text x="60" y="898" font-size="17"><tspan fill="#d9cfb0" font-weight="bold">Os</tspan><tspan fill="#8a8070"> › </tspan><tspan fill="#86a832" font-weight="bold">Pourriture</tspan><tspan fill="#c8bea8"> : l'os survit à la chair qui pourrit</tspan></text>
<text x="60" y="929" font-size="17"><tspan fill="#86a832" font-weight="bold">Pourriture</tspan><tspan fill="#8a8070"> › </tspan><tspan fill="#c9a23a" font-weight="bold">Ferveur</tspan><tspan fill="#c8bea8"> : la peste fait douter les fidèles</tspan></text>
