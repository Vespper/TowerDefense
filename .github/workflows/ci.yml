# Vérifie chaque PR : scripts qui se chargent sans erreur, puis tests headless.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d "$HOME/godot"
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Vérifier les scripts
        run: tools/check.sh
      - name: Tests
        run: tools/test.sh
